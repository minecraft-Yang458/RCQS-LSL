name: PR GDScript Check

# 1. 删掉 paths 限制，让任何 PR 变动都触发 Action 启动
on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 检查是否有 GDScript 文件变动
        id: check_files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gd:
              - '**.gd'

      - name: 设置 Python（只有需要检查时才装，节省时间）
        if: steps.check_files.outputs.gd == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 gdtoolkit（只有需要检查时才装）
        if: steps.check_files.outputs.gd == 'true'
        run: pip install gdtoolkit

      - name: 运行 GDScript 检查（核心）
        if: steps.check_files.outputs.gd == 'true'
        run: gdlint .

      # 3. 关键兜底：如果没改 .gd 文件，这一行会输出绿色提示，让 GitHub 认为检查通过
      - name: 无 GDScript 变动，本检查自动放行
        if: steps.check_files.outputs.gd == 'false'
        run: echo "✅ No GDScript changes, check passed automatically."
